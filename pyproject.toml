[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-productivity-assistant"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastmcp>=2.11,<3.0",
    "python-dotenv",
    "streamlit",
    "groq",
]

[tool.setuptools.packages.find]
include = ["task_mcp_server*", "notes_mcp_server*", "client*"]